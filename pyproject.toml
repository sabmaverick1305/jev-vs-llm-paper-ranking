[project]
name = "ai-engg-day1"
version = "0.1.0"
description = "Benchmark JEV vs an LLM for ranking arXiv papers, plus a small research API"
readme = "README.md"
authors = [
    { name = "sabmaverick81", email = "191206259+sabmaverick1305@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-engg-day1 = "ai_engg_day1:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
